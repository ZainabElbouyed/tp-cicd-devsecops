name: Pipeline CI/CD
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and Test
        run: pip install -r requirements.txt

      - name: Scan Dockerfile (IaC Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true

      - name: Build Docker image
        run: docker build -t mon-flask-cicd:${{ github.sha }} .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mon-flask-cicd:${{ github.sha }}'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

  push-image:
    needs: build-and-scan 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mon-flask-cicd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mon-flask-cicd:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mon-flask-cicd:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mon-flask-cicd:buildcache,mode=max